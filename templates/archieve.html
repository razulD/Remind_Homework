<!DOCTYPE html>
<html>
<head>
    <title>Archived Homework</title>
    <style>
        body { background-color: black; color: white; font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        h2 { border-bottom: 2px solid gray; padding-bottom: 10px; color: gray; }
        .task-card { border: 1px solid gray; padding: 15px; margin-bottom: 10px; color: #aaa; }
        .nav-link { color: white; text-decoration: none; display: block; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <a href="/" class="nav-link">← Back to Active Homework</a>

    <h2>Completed Tasks</h2>
    
    {% if not tasks %}
        <p style="color: gray;">No completed homework yet.</p>
    {% endif %}

    {% for t in tasks %}
        <div class="task-card">
            <strong>[{{ t.subject }}]</strong><br>
            {{ t.task }}
        </div>
    {% endfor %}

</body>
</html>
