<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <section>
            <h2>Add New Homework</h2>
            <form action="/add" method="POST">
                <label for="subjectSelect">1. Select Subject</label>
                <select name="subject" id="subjectSelect" onchange="toggleCustom()">
                    {% for sub in subjects %}
                        <option value="{{ sub }}">{{ sub }}</option>
                    {% endfor %}
                </select>
                
                <input type="text" name="custom_subject" id="customInput" placeholder="Type custom subject..." style="display:none;">
                
                <label for="taskInput">2. What is the homework?</label>
                <input type="text" name="task" id="taskInput" placeholder="e.g. Read Chapter 4 & finish exercise 2" required>
                
                <button type="submit">Add Homework</button>
            </form>
        </section>

        <section>
            <h2>Active Homework</h2>
            {% if not tasks %}
                <p class="empty-msg">Nothing to do right now!</p>
            {% endif %}

            {% for index, t in tasks %}
                <div class="task-card">
                    <div class="task-info">
                        <span class="subject-tag">{{ t.subject }}</span>
                        <span class="task-text">{{ t.task }}</span>
                    </div>
                    <a href="/done/{{ index }}" class="done-btn">Mark Done</a>
                </div>
            {% endfor %}
        </section>

        <a href="/archive" class="nav-link">View Archived Homework →</a>
    </div>

    <script>
        function toggleCustom() {
            var select = document.getElementById("subjectSelect");
            var custom = document.getElementById("customInput");
            if (select.value === "OTHERS") {
                custom.style.display = "block";
                custom.required = true;
            } else {
                custom.style.display = "none";
                custom.required = false;
            }
        }
    </script>
</body>
</html>
